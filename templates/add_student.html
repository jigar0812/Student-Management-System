{% extends 'base.html' %}{% block title %}Add Student{% endblock %}{% block content %}<div class="card"><h1>Add Student</h1><form method="post">{% for field,label in [('name','Name'),('roll_no','Roll Number'),('email','Email'),('course','Course')] %}<label>{{label}}</label><input name="{{field}}" value="{{student.get(field,'')}}" required>{% endfor %}<button>Save Student</button> <a class="btn gray" href="{{url_for('index')}}">Cancel</a></form></div>{% endblock %}
