{% extends 'base.html' %}{% block title %}Edit Student{% endblock %}{% block content %}<div class="card"><h1>Edit Student</h1><form method="post">{% for field,label in [('name','Name'),('roll_no','Roll Number'),('email','Email'),('course','Course')] %}<label>{{label}}</label><input name="{{field}}" value="{{student[field]}}" required>{% endfor %}<button>Update Student</button> <a class="btn gray" href="{{url_for('index')}}">Cancel</a></form></div>{% endblock %}
