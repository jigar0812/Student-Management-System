{% extends 'base.html' %}{% block title %}Students{% endblock %}{% block content %}<h1>Student Records</h1><form class="search" action="{{url_for('search')}}"><input name="q" placeholder="Search students" value="{{search_query|default('')}}"><button>Search</button><a class="btn gray" href="{{url_for('index')}}">Clear</a></form><div class="table"><table><tr><th>ID</th><th>Name</th><th>Roll No.</th><th>Email</th><th>Course</th><th>Actions</th></tr>{% for s in students %}<tr><td>{{s['id']}}</td><td>{{s['name']}}</td><td>{{s['roll_no']}}</td><td>{{s['email']}}</td><td>{{s['course']}}</td><td><a class="btn small" href="{{url_for('edit',student_id=s['id'])}}">Edit</a><form class="inline" method="post" action="{{url_for('delete',student_id=s['id'])}}"><button class="small danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No students found.</td></tr>{% endfor %}</table></div>{% endblock %}
